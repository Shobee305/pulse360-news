<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE 360 Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f8;color:#172033;font:16px/1.8 Tahoma,Arial,sans-serif}header{background:#0c1729;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.logo{font:bold 28px Arial;direction:ltr;text-align:right}.logo span{color:#e63946}.panel{background:white;border:1px solid #e0e5ee;border-radius:15px;padding:17px;margin:14px 0}h1,h2{margin:0 0 12px}label{display:block;font-weight:bold;font-size:13px;margin:10px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:9px;font:inherit}textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#e63946;color:white;font-weight:bold;font:inherit;cursor:pointer;margin:4px 0}.secondary{background:#e8edf5;color:#172033}.danger{background:#991b1b}.hidden{display:none}.muted{color:#667085;font-size:12px}.item{padding:12px;border:1px solid #e0e5ee;border-radius:10px;margin:9px 0}.error{background:#fee2e2;padding:10px;border-radius:8px;color:#991b1b}.ok{background:#dcfce7;padding:10px;border-radius:8px;color:#166534}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><div class="logo">PULSE <span>360</span></div><div>محفوظ ایڈمن پینل</div></div></header><main class="wrap">
<section id="login" class="panel"><h1>ایڈمن لاگ اِن</h1><p class="muted">یہ پاس ورڈ Cloudflare Pages کے secret میں سیٹ ہونا چاہیے۔</p><label>ایڈمن پاس ورڈ</label><input id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">لاگ اِن</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><div class="panel"><h1>نئی خبر</h1><form id="form"><label>عنوان *</label><input id="title" required maxlength="180"><div class="row"><div><label>کیٹیگری</label><select id="category"><option>جیوپولیٹکس</option><option>پاکستان</option><option>عالمی خبریں</option><option>دفاع</option><option>ٹیکنالوجی</option><option>تجزیہ</option></select></div><div><label>حالت</label><select id="status"><option value="draft">ڈرافٹ</option><option value="published">شائع کریں</option></select></div></div><label>مختصر تعارف</label><textarea id="summary" style="min-height:75px"></textarea><label>مکمل خبر *</label><textarea id="body" required></textarea><label>تصویر کا براہِ راست URL (اختیاری)</label><input id="image_url" type="url" placeholder="https://..."><label>ماخذ کا URL (اختیاری)</label><input id="source_url" type="url" placeholder="https://..."><button class="btn" type="submit">خبر محفوظ کریں</button><button class="btn secondary" type="reset">فارم صاف کریں</button></form><div id="formMsg"></div></div>
<div class="panel"><h2>خبریں / ڈرافٹس</h2><button class="btn secondary" id="reload">فہرست تازہ کریں</button><div id="list"></div></div><div class="panel"><button class="btn secondary" id="logout">لاگ آؤٹ</button></div></section>
</main><script>
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'درخواست مکمل نہیں ہوئی');return d}
function msg(id,text,ok=false){$(id).innerHTML='<div class="'+(ok?'ok':'error')+'">'+text+'</div>'}
async function check(){try{const d=await api('/api/auth/me');$('login').classList.toggle('hidden',d.authenticated);$('app').classList.toggle('hidden',!d.authenticated);if(d.authenticated)load()}catch(e){msg('loginMsg',e.message)}}
$('loginBtn').onclick=async()=>{try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('loginMsg').innerHTML='';await check()}catch(e){msg('loginMsg',e.message)}};
$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});$('app').classList.add('hidden');$('login').classList.remove('hidden')};
$('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/news',{method:'POST',body:JSON.stringify({title:$('title').value,category:$('category').value,status:$('status').value,summary:$('summary').value,body:$('body').value,image_url:$('image_url').value,source_url:$('source_url').value})});msg('formMsg','خبر ڈیٹا بیس میں محفوظ ہو گئی۔',true);$('form').reset();load()}catch(err){msg('formMsg',err.message)}};
async function load(){try{const d=await api('/api/news?status=draft');const p=await api('/api/news?status=published');const all=[...(d.news||[]),...(p.news||[])];$('list').innerHTML=all.length?'':'<p class="muted">ابھی کوئی خبر موجود نہیں۔</p>';all.forEach(n=>{const el=document.createElement('div');el.className='item';const h=document.createElement('b');h.textContent=n.title;const info=document.createElement('div');info.className='muted';info.textContent=n.category+' · '+(n.status==='published'?'شائع شدہ':'ڈرافٹ');el.append(h,info);const pub=document.createElement('button');pub.className='btn secondary';pub.textContent=n.status==='published'?'ڈرافٹ بنائیں':'شائع کریں';pub.onclick=async()=>{await api('/api/news',{method:'PATCH',body:JSON.stringify({id:n.id,status:n.status==='published'?'draft':'published'})});load()};const del=document.createElement('button');del.className='btn danger';del.textContent='حذف';del.onclick=async()=>{if(confirm('یہ خبر مستقل حذف کریں؟')){await api('/api/news',{method:'DELETE',body:JSON.stringify({id:n.id})});load()}};el.append(pub,del);$('list').append(el)})}catch(e){$('list').innerHTML='<div class="error">'+e.message+'</div>'}}
$('reload').onclick=load;check();
</script></body></html>
